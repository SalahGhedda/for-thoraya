<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf3ef">
  <meta name="description" content="From Salah, to Thoraya.">
  <title>For Thoraya</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./bouquet.js" defer></script>
</head>
<body class="preparing">
  <main class="gift" aria-label="A bouquet for Thoraya">
    <div class="drawing-stage">
      <svg id="bouquet" viewBox="20 0 560 780" role="img" aria-labelledby="bouquet-title bouquet-desc">
        <title id="bouquet-title">A wrapped bouquet for Thoraya</title>
        <desc id="bouquet-desc">A full bouquet of coral and burgundy roses, blush peonies, an ivory lily, apricot flowers, blue hydrangeas, daisies, and lavender. Layered ivory and rose-colored paper surrounds the flowers, with fine gold edging and a deep rose satin bow.</desc>
        <defs>
          <radialGradient id="coral" cx=".34" cy=".22" r=".95"><stop stop-color="#ffe0d0"/><stop offset=".48" stop-color="#ed9992"/><stop offset="1" stop-color="#c85b71"/></radialGradient>
          <radialGradient id="wine" cx=".3" cy=".18" r=".95"><stop stop-color="#efb4bc"/><stop offset=".45" stop-color="#c86683"/><stop offset="1" stop-color="#8e3458"/></radialGradient>
          <radialGradient id="pink" cx=".32" cy=".2" r="1"><stop stop-color="#ffe7e5"/><stop offset=".5" stop-color="#eeb8c8"/><stop offset="1" stop-color="#c880a0"/></radialGradient>
          <radialGradient id="cream" cx=".3" cy=".15" r=".95"><stop stop-color="#fffef6"/><stop offset=".6" stop-color="#f6e6cd"/><stop offset="1" stop-color="#d5b3a3"/></radialGradient>
          <radialGradient id="apricot" cx=".3" cy=".2" r="1"><stop stop-color="#fff0c9"/><stop offset=".5" stop-color="#f5c58d"/><stop offset="1" stop-color="#d9926f"/></radialGradient>
          <radialGradient id="lily" cx=".5" cy=".1" r="1"><stop stop-color="#fffcf3"/><stop offset=".55" stop-color="#f8e9df"/><stop offset="1" stop-color="#d99da9"/></radialGradient>
          <radialGradient id="blue" cx=".35" cy=".2" r="1"><stop stop-color="#e0e9ee"/><stop offset=".6" stop-color="#abc9d7"/><stop offset="1" stop-color="#7c9db9"/></radialGradient>
          <linearGradient id="leaf" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#b0bfa0"/><stop offset=".45" stop-color="#789a7b"/><stop offset="1" stop-color="#436c61"/></linearGradient>
          <linearGradient id="eucalyptus" x2="1" y2="1"><stop stop-color="#c5d4c3"/><stop offset=".5" stop-color="#98b6a6"/><stop offset="1" stop-color="#6e968b"/></linearGradient>
          <linearGradient id="back-paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf7"/><stop offset=".55" stop-color="#f1e1dc"/><stop offset="1" stop-color="#d9b4b3"/></linearGradient>
          <linearGradient id="rose-paper" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#eac6c4"/><stop offset=".22" stop-color="#f9dfd9"/><stop offset=".55" stop-color="#d3a4ad"/><stop offset="1" stop-color="#b88398"/></linearGradient>
          <linearGradient id="ivory-paper" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#d8bdbb"/><stop offset=".22" stop-color="#f6e9df"/><stop offset=".6" stop-color="#fff9ec"/><stop offset="1" stop-color="#edddce"/></linearGradient>
          <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset=".55" stop-color="#f5e2d5"/><stop offset="1" stop-color="#d9b5b4"/></linearGradient>
          <linearGradient id="satin" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#8e3e5e"/><stop offset=".26" stop-color="#c67d91"/><stop offset=".43" stop-color="#e3a8b0"/><stop offset=".6" stop-color="#b65e7c"/><stop offset="1" stop-color="#8f3758"/></linearGradient>
          <linearGradient id="satin-tail" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#a34d6b"/><stop offset=".4" stop-color="#d88e9f"/><stop offset=".6" stop-color="#df9fa9"/><stop offset="1" stop-color="#a04c6c"/></linearGradient>
        </defs>
        <g id="paper-back"></g><g id="stems"></g><g id="foliage"></g><g id="flowers"></g><g id="paper-front"></g><g id="ribbon"></g>
      </svg>
    </div>
    <p class="dedication" aria-label="From Salah, to Thoraya"><span class="from" aria-hidden="true">From Salah,</span> <span class="to" aria-hidden="true">to Thoraya</span></p>
    <div class="controls">
      <button id="replay" type="button" aria-label="Replay the bouquet animation" title="Replay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 7.5A8 8 0 1 1 4 13M5 3v5h5"/></svg></button>
      <button id="pause" type="button" aria-label="Pause animation" title="Pause"><svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z"/></svg></button>
    </div>
  </main>
</body>
</html>
